<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Hack Tools</title><meta name="description" content="Rekomendasi alat kecil yang bikin hidup lebih gampang.">
<link rel="stylesheet" href="style.css"></head><body>
<header><a class="logo" href="/">Life Hack Tools</a><nav aria-label="Menu"><a href="#" data-n="home" class="on"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Beranda</a><a href="#" data-n="chat"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-5.4A8 8 0 1121 12z"/></svg>Chat bantuan<i class="dot" id="cd" hidden></i></a><a href="#" data-n="kat"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Kategori</a></nav><div class="sr"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cari produk..." aria-label="Cari produk"></div><div id="mn" hidden></div></header>
<main><h1>Alat kecil yang bikin <span>hidup lebih gampang.</span></h1><p class="sub">Temukan berbagai produk pilihan untuk mendukung aktivitas sehari-hari dengan kualitas terbaik dan harga terjangkau.</p><div class="tb"><div id="ch"></div><div class="vw" role="group" aria-label="Ukuran tampilan"><button data-sz="l" title="Ikon besar" aria-label="Ikon besar"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button><button data-sz="m" title="Ikon sedang" aria-label="Ikon sedang"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button><button data-sz="s" title="Ikon kecil" aria-label="Ikon kecil"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg></button></div></div><div id="gr"></div></main>
<footer>Selamat berbelanja, semoga hari Anda menyenangkan.</footer>
<dialog id="dg"></dialog><dialog id="ct"></dialog>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="common.js"></script>
<script>
let C=[],K=[],P=[],cat="",sub="",q="";
const CART='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h8.3a2 2 0 002-1.5L21 7H6"/></svg>';
const GRID='<svg class="i" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>';
const TAG='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>';
const buy=p=>`<a class="btn" href="${esc(safe(p.affiliate_url))}" target="_blank" rel="nofollow sponsored noopener" data-buy="${p.id}">${CART}Beli</a>`;
const thumb=p=>{const i=p.images.find(u=>!isVid(u));if(i)return `<img src="${esc(i)}" alt="${esc(p.title)}" loading="lazy">`;const v=p.images[0];return v?`<video src="${esc(v)}#t=0.1" preload="metadata" muted playsinline></video>`:ph(p)};
const ph=p=>`<div class="ph">${esc(p.title.charAt(0).toUpperCase())}</div>`;
function chips(){const s=K.filter(k=>k.catalog_id===cat);
$("#ch").innerHTML=`<div class="chips"><button class="chip ${!cat?"on":""}" data-c="">${GRID}Semua</button>${C.map(c=>`<button class="chip ${cat===c.id?"on":""}" data-c="${c.id}">${TAG}${esc(c.name)}</button>`).join("")}</div>`+(cat&&s.length?`<div class="chips"><button class="chip ${!sub?"on":""}" data-k="">Semua kategori</button>${s.map(k=>`<button class="chip ${sub===k.id?"on":""}" data-k="${k.id}">${esc(k.name)}</button>`).join("")}</div>`:"")}
let sz="m";try{sz=localStorage.getItem("lht_sz")||"m"}catch(_){}
function setSz(v){sz=v;try{localStorage.setItem("lht_sz",v)}catch(_){}document.querySelectorAll("[data-sz]").forEach(b=>b.classList.toggle("on",b.dataset.sz===v));grid()}
const TID=()=>{let t;try{t=localStorage.getItem("lht_t")}catch(_){}if(!t){t=crypto.randomUUID();try{localStorage.setItem("lht_t",t)}catch(_){}}return t};
let ctm=null;
async function chatDraw(){const{data}=await sb.rpc("get_chat",{p_thread:TID()}),m=data||[],b=$("#cmsg");if(!b)return;
b.innerHTML=(m.length?"":'<p class="m">Halo! Kirim pesan jika ada link yang rusak atau produk bermasalah. Sebutkan nomor produknya (No.). Balasan admin akan muncul di sini.</p>')+m.map(x=>`<div class="b ${x.sender==="user"?"out":"in"}">${esc(x.body)}<small>${new Date(x.created_at).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small></div>`).join("");
b.scrollTop=b.scrollHeight;try{localStorage.setItem("lht_seen",m.filter(x=>x.sender==="admin").length)}catch(_){}$("#cd").hidden=true}
async function chatOpen(pre){$("#ct").innerHTML='<div class="row" style="padding:0"><b>Chat bantuan</b><button class="g" id="cx">Tutup</button></div><div id="cmsg" class="cmsg"></div><div class="cin"><input id="ci" placeholder="Tulis pesan..." maxlength="1000" autocomplete="off"><button id="cs">Kirim</button></div>';
if(!$("#ct").open)$("#ct").showModal();if(pre)$("#ci").value=pre;clearInterval(ctm);await chatDraw();ctm=setInterval(chatDraw,5000)}
async function chatSend(){const i=$("#ci"),v=i.value.trim();if(!v)return;i.value="";const m=/no\.?\s*#?(\d+)|#(\d+)/i.exec(v);
const{error}=await sb.rpc("send_chat",{p_thread:TID(),p_body:v,p_product:m?+(m[1]||m[2]):null});if(error){i.value=v;return toast("Gagal mengirim: "+error.message)}chatDraw()}
$("#ct").addEventListener("close",()=>clearInterval(ctm));
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ci")chatSend()});
async function dotCheck(){let t,s=0;try{t=localStorage.getItem("lht_t");s=+localStorage.getItem("lht_seen")||0}catch(_){}if(!t||$("#ct").open)return;const{data}=await sb.rpc("get_chat",{p_thread:t});$("#cd").hidden=(data||[]).filter(x=>x.sender==="admin").length<=s}
dotCheck();setInterval(dotCheck,30000);
function menu(){$("#mn").innerHTML=C.length?C.map(c=>`<div class="mg"><button class="mh" data-mc="${c.id}">${TAG}${esc(c.name)}</button>${K.filter(k=>k.catalog_id===c.id).map(k=>`<button class="mi" data-mc="${c.id}" data-mk="${k.id}">${esc(k.name)}</button>`).join("")}</div>`).join(""):'<span class="m">Belum ada kategori.</span>'}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#mn").hidden=true});
function grid(){const t=q.toLowerCase(),l=P.filter(p=>(!cat||p.catalog_id===cat)&&(!sub||p.category_id===sub)&&(!t||p.title.toLowerCase().includes(t)||String(p.no)===t.replace(/^(#|no\.?\s*)/,"")));
$("#gr").innerHTML=l.length?`<div class="grid sz-${sz}">${l.map(p=>`<article class="card" data-id="${p.id}"><div class="im">${thumb(p)}<span class="no">No.${p.no}</span></div><div class="cb"><h3>${esc(p.title)}</h3><p class="m">${esc(nm(K,p.category_id))}</p><div class="row"><span class="pr">${rp(p.price)}</span>${buy(p)}</div></div></article>`).join("")}</div>`:`<div class="empty">Belum ada produk di sini. Coba pilih katalog lain atau ubah kata kunci.</div>`}
function detail(id,i=0){const p=P.find(x=>x.id===id);if(!p)return;const e=yt(p.video_url),m=p.images,cur=m[i];
$("#dg").innerHTML=`<div class="row" style="padding:0"><h2 style="margin:0"><span class="no sm">No.${p.no}</span>${esc(p.title)}</h2><button class="g" id="x">Tutup</button></div>${cur?(isVid(cur)?`<video src="${esc(cur)}" controls playsinline></video>`:`<img src="${esc(cur)}" alt="">`):""}${m.length>1?`<div class="th">${m.map((u,j)=>isVid(u)?`<video class="${j===i?"on":""}" src="${esc(u)}#t=0.1" preload="metadata" muted data-p="${id}" data-i="${j}"></video>`:`<img class="${j===i?"on":""}" src="${esc(u)}" data-p="${id}" data-i="${j}" alt="">`).join("")}</div>`:""}${e?`<iframe src="${e}" allowfullscreen loading="lazy"></iframe>`:p.video_url?`<p><a href="${esc(safe(p.video_url))}" target="_blank" rel="noopener">Tonton video</a></p>`:""}<p class="desc">${esc(p.description)}</p><button class="g" data-rep="${p.no}">Laporkan link rusak</button><div class="row"><span class="pr">${rp(p.price)}</span>${buy(p)}</div>`;
if(!$("#dg").open)$("#dg").showModal();history.replaceState(null,"","#p"+p.no)}
$("#dg").addEventListener("close",()=>history.replaceState(null,"",location.pathname+location.search));
document.addEventListener("click",e=>{const t=e.target;
const zs=t.closest("[data-sz]");if(zs)return setSz(zs.dataset.sz);
if(t===$("#ct")||t.id==="cx")return $("#ct").close();
if(t.id==="cs")return chatSend();
const rr=t.closest("[data-rep]");if(rr){$("#dg").close();return chatOpen("Link produk No."+rr.dataset.rep+" rusak.")}
const n=t.closest("[data-n]");if(n){e.preventDefault();const k=n.dataset.n,mn=$("#mn");if(k==="chat"){mn.hidden=true;chatOpen();return}if(k==="kat"){if(mn.hidden){menu();mn.hidden=false}else mn.hidden=true}else{mn.hidden=true;cat="";sub="";q="";$("#q").value="";chips();grid();k==="home"?scrollTo({top:0,behavior:"smooth"}):$("#gr").scrollIntoView({behavior:"smooth"})}document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a===n));return}
const mk=t.closest("[data-mc]");if(mk){cat=mk.dataset.mc;sub=mk.dataset.mk||"";$("#mn").hidden=true;chips();grid();$("#gr").scrollIntoView({behavior:"smooth"});return}
if(!t.closest("#mn"))$("#mn").hidden=true;
const bb=t.closest("[data-buy]");if(bb){sb.from("click_logs").insert({product_id:bb.dataset.buy}).then(()=>{});return}
if(t.id==="x"||t===$("#dg"))return $("#dg").close();
if(t.dataset.p)return detail(t.dataset.p,+t.dataset.i);
const cc=t.closest("[data-c]");if(cc){cat=cc.dataset.c;sub="";chips();return grid()}
const kk=t.closest("[data-k]");if(kk){sub=kk.dataset.k;chips();return grid()}
const c=t.closest(".card");if(c)detail(c.dataset.id)});
$("#q").oninput=e=>{q=e.target.value;grid()};
(async()=>{const[a,b,c]=await Promise.all([sb.from("catalogs").select("*").order("name"),sb.from("categories").select("*").order("name"),sb.from("products").select("*").eq("active",true).order("created_at",{ascending:false})]);
C=a.data||[];K=b.data||[];P=c.data||[];chips();setSz(sz);const h=/^#p(\d+)$/.exec(location.hash);if(h){const p=P.find(x=>x.no===+h[1]);if(p)detail(p.id)}})();
</script></body></html>
